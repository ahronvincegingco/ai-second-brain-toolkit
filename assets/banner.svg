<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap');
      .hero-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 215px;
        letter-spacing: -7px;
        fill: #050505;
        line-height: 0.85;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.2px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Clean Minimalist White Card Background (Matching Addy Osmani iOS Theme) -->
  <rect width="1000" height="640" rx="20" fill="#ffffff" />

  <!-- Big Bold Typography -->
  <!-- Line 1: Second (Top-Left Aligned) -->
  <text x="60" y="225" class="hero-text">Second</text>

  <!-- Line 2: Brain (Bottom-Right Aligned) -->
  <text x="940" y="440" class="hero-text" text-anchor="end">Brain</text>

  <!-- Colorful iOS Rounded Pill Badges Row -->
  <!-- Pill 1: Capture (iOS System Blue #007AFF / #2563EB) -->
  <g transform="translate(60, 526)">
    <rect width="124" height="54" rx="27" fill="#2563eb" />
    <text x="62" y="28" class="pill-text" fill="#ffffff">Capture</text>
  </g>

  <!-- Pill 2: Stage (iOS Coral / Orange #EA580C) -->
  <g transform="translate(196, 526)">
    <rect width="108" height="54" rx="27" fill="#ea580c" />
    <text x="54" y="28" class="pill-text" fill="#ffffff">Stage</text>
  </g>

  <!-- Pill 3: Verify (iOS Amber / Yellow #FACC15, Dark Text) -->
  <g transform="translate(316, 526)">
    <rect width="116" height="54" rx="27" fill="#facc15" />
    <text x="58" y="28" class="pill-text" fill="#0f172a">Verify</text>
  </g>

  <!-- Pill 4: Vault (Obsidian Purple #7C3AED) -->
  <g transform="translate(444, 526)">
    <rect width="110" height="54" rx="27" fill="#7c3aed" />
    <text x="55" y="28" class="pill-text" fill="#ffffff">Vault</text>
  </g>

  <!-- Pill 5: Recall (iOS Cyan / Sky Blue #0284C7) -->
  <g transform="translate(566, 526)">
    <rect width="116" height="54" rx="27" fill="#0284c7" />
    <text x="58" y="28" class="pill-text" fill="#ffffff">Recall</text>
  </g>

  <!-- Pill 6: Private (iOS Rose / Crimson #E11D48) -->
  <g transform="translate(694, 526)">
    <rect width="122" height="54" rx="27" fill="#e11d48" />
    <text x="61" y="28" class="pill-text" fill="#ffffff">Private</text>
  </g>

  <!-- Pill 7: $0 Free (iOS Emerald Green #16A34A) -->
  <g transform="translate(828, 526)">
    <rect width="112" height="54" rx="27" fill="#16a34a" />
    <text x="56" y="28" class="pill-text" fill="#ffffff">$0 Free</text>
  </g>
</svg>
