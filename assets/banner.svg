<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#161b26" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -0.5px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
    .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect width="1200" height="380" rx="16" fill="url(#purpleGlow)" />
  <rect width="1200" height="380" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" rx="16" fill="url(#emeraldGlow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Top Decorative Accent Line -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1184 0 C 1192.84 0 1200 7.16 1200 16 L 1200 3 L 0 3 Z" fill="url(#accentPurple)" />

  <!-- Brain & Nodes Icon Graphic -->
  <g transform="translate(60, 48)">
    <!-- Outer Icon Halo -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="38" cy="38" r="28" fill="#8b5cf6" fill-opacity="0.2" />

    <!-- Stylized Brain Vector -->
    <path d="M 38 20 C 31 20 26 25 26 31 C 23 32 21 35 21 39 C 21 44 24 47 28 48 C 29 52 33 56 38 56 C 38 50 38 46 38 42 C 34 42 32 39 32 36 C 32 32 35 29 38 29 Z" fill="#c084fc" />
    <path d="M 38 20 C 45 20 50 25 50 31 C 53 32 55 35 55 39 C 55 44 52 47 48 48 C 47 52 43 56 38 56 C 38 50 38 46 38 42 C 42 42 44 39 44 36 C 44 32 41 29 38 29 Z" fill="#818cf8" />
    <!-- Center divider -->
    <line x1="38" y1="22" x2="38" y2="54" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
  </g>

  <!-- Header Titles -->
  <text x="156" y="86" class="title">AI Second Brain Toolkit</text>
  <text x="158" y="116" class="subtitle">Fail-closed personal memory engine connecting Obsidian to local AI agents</text>

  <!-- Top-Right Pill Badges -->
  <g transform="translate(730, 56)">
    <!-- Pill 1: 100% Local -->
    <rect x="0" y="0" width="138" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#3b82f6" />
    <text x="30" y="20" class="badge-text" fill="#93c5fd">100% Local stdio</text>

    <!-- Pill 2: Fail-Closed -->
    <rect x="150" y="0" width="138" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="166" cy="15" r="4.5" fill="#10b981" />
    <text x="180" y="20" class="badge-text" fill="#6ee7b7">Fail-Closed QA</text>

    <!-- Pill 3: $0 Cost -->
    <rect x="300" y="0" width="110" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="316" cy="15" r="4.5" fill="#a855f7" />
    <text x="330" y="20" class="badge-text" fill="#d8b4fe">$0 / Free</text>
  </g>

  <!-- Architecture Flow Pipeline Cards (Lower Section) -->
  <g transform="translate(60, 168)">
    <!-- Pipeline Background Bar -->
    <rect x="0" y="0" width="1080" height="154" rx="14" fill="#0b1120" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.2" />

    <!-- Pipeline Step 1: AI Clients -->
    <g transform="translate(24, 22)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="30" height="30" rx="7" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
      <text x="24" y="37" font-family="sans-serif" font-size="16">🤖</text>
      <text x="56" y="32" class="card-title">Local AI Clients</text>
      <text x="56" y="48" class="card-subtitle">Claude • Codex • Cursor</text>
      <text x="16" y="76" font-family="monospace" font-size="11" fill="#a5b4fc">/brain-save</text>
      <text x="16" y="94" font-family="monospace" font-size="11" fill="#94a3b8">/brain-recall</text>
    </g>

    <!-- Connection Arrow 1 -->
    <g transform="translate(254, 65)">
      <line x1="0" y1="12" x2="38" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />
      <polygon points="38,8 46,12 38,16" fill="#818cf8" />
      <text x="2" y="-2" class="arrow-text">stdio IPC</text>
    </g>

    <!-- Pipeline Step 2: Policy & Staging -->
    <g transform="translate(310, 22)">
      <rect x="0" y="0" width="230" height="110" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
      <rect x="16" y="16" width="30" height="30" rx="7" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
      <text x="24" y="37" font-family="sans-serif" font-size="16">🛡️</text>
      <text x="56" y="32" class="card-title">Staging &amp; Security</text>
      <text x="56" y="48" class="card-subtitle">Fail-Closed Verification</text>
      <text x="16" y="76" font-family="monospace" font-size="11" fill="#c4b5fd">SHA-256 Grant Pinning</text>
      <text x="16" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Zero Traversal / Anti-DOS</text>
    </g>

    <!-- Connection Arrow 2 -->
    <g transform="translate(550, 65)">
      <line x1="0" y1="12" x2="38" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />
      <polygon points="38,8 46,12 38,16" fill="#10b981" />
      <text x="0" y="-2" class="arrow-text">atomic</text>
    </g>

    <!-- Pipeline Step 3: Vault Truth -->
    <g transform="translate(606, 22)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <rect x="16" y="16" width="30" height="30" rx="7" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="24" y="37" font-family="sans-serif" font-size="16">📂</text>
      <text x="56" y="32" class="card-title">Obsidian Vault</text>
      <text x="56" y="48" class="card-subtitle">Single-Source Truth</text>
      <text x="16" y="76" font-family="monospace" font-size="11" fill="#6ee7b7">Permanent Markdown</text>
      <text x="16" y="94" font-family="monospace" font-size="11" fill="#94a3b8">OneDrive / iCloud Synced</text>
    </g>

    <!-- Connection Arrow 3 -->
    <g transform="translate(836, 65)">
      <line x1="0" y1="12" x2="38" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />
      <polygon points="38,8 46,12 38,16" fill="#38bdf8" />
      <text x="0" y="-2" class="arrow-text">verified</text>
    </g>

    <!-- Pipeline Step 4: Recall Engine -->
    <g transform="translate(892, 22)">
      <rect x="0" y="0" width="164" height="110" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1" />
      <rect x="16" y="16" width="30" height="30" rx="7" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
      <text x="24" y="37" font-family="sans-serif" font-size="16">⚡</text>
      <text x="56" y="32" class="card-title">Recall Engine</text>
      <text x="56" y="48" class="card-subtitle">Read-Only Tools</text>
      <text x="16" y="76" font-family="monospace" font-size="11" fill="#7dd3fc">FTS Search</text>
      <text x="16" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Cited Excerpts</text>
    </g>
  </g>
</svg>
