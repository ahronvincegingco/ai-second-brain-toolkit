name: CI

on:
  push:
    branches: [main, feat/macos-support]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-mcp.lock

      - name: Use physical temporary directory on macOS
        if: runner.os == 'macOS'
        run: |
          python -c "import os, pathlib, tempfile; p = str(pathlib.Path(tempfile.gettempdir()).resolve()); open(os.environ['GITHUB_ENV'], 'a').write('TMPDIR=' + p + '\n')"

      - name: Run environment diagnostics
        run: |
          python scripts/install_toolkit.py --check-only --private-dir "${{ runner.temp }}/second-brain-private"

      - name: Run full test suite
        run: |
          python -m unittest discover -s tests -v
